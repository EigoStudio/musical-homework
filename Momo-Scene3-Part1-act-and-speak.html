<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Momo - Scene 3 - Part 1: Act & Speak!</title>
    <script src="auth.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --primary-orange: #e67e22;
            --dark-orange: #d35400;
            --bg-cream: #fff3dd;
            --bg-body: #fffaf0;
            --text-main: #2c3e50;
            --accent-blue: #3498db;
            --accent-purple: #9b59b6;
            --accent-pink: #ff78ae;
            --accent-red: #e74c3c;
            --accent-green: #2ecc71;
        }

        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: 'Comic Neue', 'Zen Maru Gothic', cursive, sans-serif;
            min-height: 100vh;
        }

        .main-container {
            width: 100%;
            max-width: 1080px;
            background-color: var(--bg-cream);
            border-radius: 28px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.12);
            padding: 24px 30px;
            border: 5px dashed var(--primary-orange);
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 4px solid var(--primary-orange);
            padding-bottom: 12px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .header-titles { text-align: left; }
        .main-title { font-size: 1.9rem; font-weight: 700; color: var(--dark-orange); margin: 0; }
        .sub-title { font-size: 1.05rem; font-weight: 700; color: #7f8c8d; margin: 2px 0 0 0; }

        .mode-controls {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .mode-btn {
            background: white;
            color: #7f8c8d;
            border: 3px solid #f5deb3;
            padding: 8px 18px;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: bold;
            font-family: inherit;
            cursor: pointer;
            transition: 0.15s;
        }
        .mode-btn.active {
            background: var(--primary-orange);
            color: white;
            border-color: var(--dark-orange);
            box-shadow: 0 3px 8px rgba(230, 126, 34, 0.3);
        }

        /* Top Action Bar */
        .action-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
            background: rgba(255, 255, 255, 0.8);
            padding: 14px 20px;
            border-radius: 20px;
            border: 2px solid #f5deb3;
        }

        .draw-btn {
            background: linear-gradient(135deg, #ff7675, #e74c3c);
            color: white;
            border: none;
            padding: 14px 32px;
            border-radius: 50px;
            font-size: 1.35rem;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            box-shadow: 0 5px 0 #c0392b;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: transform 0.1s;
        }
        .draw-btn:hover { filter: brightness(1.05); }
        .draw-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #c0392b; }
        .draw-btn:disabled { background: #bdc3c7; box-shadow: none; cursor: not-allowed; }

        .respin-btn {
            background: var(--accent-blue);
            color: white;
            border: none;
            padding: 12px 22px;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            box-shadow: 0 4px 0 #2980b9;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .respin-btn:active { transform: translateY(2px); box-shadow: none; }
        .respin-btn:disabled { background: #bdc3c7; box-shadow: none; cursor: not-allowed; }

        .deck-badge {
            background: #fef5e7;
            border: 2px solid #f39c12;
            color: var(--dark-orange);
            padding: 6px 14px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 0.95rem;
        }

        /* Big Stage Card */
        .stage-card {
            background: #ffffff;
            border: 4px solid #f5deb3;
            border-radius: 26px;
            padding: 24px 28px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.06);
            display: flex;
            flex-direction: column;
            gap: 18px;
            position: relative;
        }
        .stage-card.card-pop {
            animation: cardFlipIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes cardFlipIn {
            0% { transform: scale(0.95); opacity: 0.5; }
            100% { transform: scale(1); opacity: 1; }
        }

        .card-top-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .card-num-badge {
            background: var(--primary-orange);
            color: white;
            font-weight: 700;
            font-size: 1.1rem;
            padding: 6px 18px;
            border-radius: 50px;
        }

        .action-hint-badge {
            background: #ebf5fb;
            border: 2px solid #aed6f1;
            color: #2980b9;
            font-weight: 700;
            font-size: 1.05rem;
            padding: 6px 18px;
            border-radius: 50px;
            font-family: 'Zen Maru Gothic', sans-serif;
        }

        /* Sentence Frame Box */
        .frame-box {
            background: #fff9e6;
            border: 3px dashed #f39c12;
            border-radius: 20px;
            padding: 18px 20px;
            text-align: center;
        }
        .frame-text {
            font-size: 2.35rem;
            font-weight: 700;
            color: #2c3e50;
            margin: 0;
            line-height: 1.3;
        }
        .blank-slot {
            display: inline-block;
            color: #e74c3c;
            background: #fadbd8;
            padding: 2px 16px;
            border-radius: 12px;
            border-bottom: 4px solid #e74c3c;
            margin: 0 4px;
        }
        .nuance-note {
            margin-top: 8px;
            font-size: 1.1rem;
            font-weight: 700;
            color: #d35400;
            font-family: 'Zen Maru Gothic', sans-serif;
        }

        /* 4 Options Grid */
        .options-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
        }

        .opt-card {
            background: #f8fafc;
            border: 4px solid #e2e8f0;
            border-radius: 20px;
            padding: 16px 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            position: relative;
            cursor: pointer;
            transition: transform 0.12s ease, border-color 0.12s ease, background-color 0.12s ease;
            min-height: 210px;
        }
        .opt-card:hover {
            border-color: #cbd5e1;
        }

        /* Roulette Spinning Highlight */
        .opt-card.roulette-scanning {
            border-color: #f39c12 !important;
            background: #fef5e7 !important;
            transform: scale(1.04);
            box-shadow: 0 0 20px rgba(243, 156, 18, 0.65);
            z-index: 4;
        }

        /* Selected Target State */
        .opt-card.selected-target {
            border-color: #ff4757 !important;
            background: linear-gradient(180deg, #fff5f5 0%, #ffeaa7 100%) !important;
            transform: scale(1.05);
            box-shadow: 0 10px 25px rgba(255, 71, 87, 0.35);
            z-index: 5;
            animation: targetPulse 1.4s infinite ease-in-out;
        }
        @keyframes targetPulse {
            0%, 100% { box-shadow: 0 8px 22px rgba(255, 71, 87, 0.35); }
            50% { box-shadow: 0 12px 32px rgba(255, 71, 87, 0.65); }
        }

        .target-star-badge {
            display: none;
            position: absolute;
            top: -16px;
            right: -10px;
            background: #ff4757;
            color: #fff;
            font-size: 1rem;
            font-weight: 700;
            padding: 5px 12px;
            border-radius: 50px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            border: 3px solid white;
            animation: popStar 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .opt-card.selected-target .target-star-badge {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        @keyframes popStar {
            0% { transform: scale(0) rotate(-30deg); }
            100% { transform: scale(1) rotate(0deg); }
        }

        .opt-svg-box {
            width: 105px;
            height: 105px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .opt-svg-box svg {
            width: 100%;
            height: 100%;
        }

        .opt-word {
            font-size: 1.35rem;
            font-weight: 700;
            color: #2c3e50;
            text-align: center;
            line-height: 1.2;
        }
        .opt-sub-jp {
            font-size: 0.95rem;
            font-weight: 700;
            color: #7f8c8d;
            font-family: 'Zen Maru Gothic', sans-serif;
            text-align: center;
        }

        /* Teacher / Answer Check Footer inside Stage Card */
        .answer-panel {
            background: #f4f6f7;
            border-radius: 18px;
            padding: 14px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            border: 2px solid #e5e8e8;
        }

        .answer-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .teacher-speak-btn {
            background: var(--accent-purple);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: bold;
            font-family: inherit;
            cursor: pointer;
            box-shadow: 0 3px 0 #763e8f;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .teacher-speak-btn:active { transform: translateY(2px); box-shadow: none; }

        .reveal-btn {
            background: var(--accent-green);
            color: white;
            border: none;
            padding: 10px 22px;
            border-radius: 50px;
            font-size: 1.05rem;
            font-weight: bold;
            font-family: inherit;
            cursor: pointer;
            box-shadow: 0 3px 0 #27ae60;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .reveal-btn:active { transform: translateY(2px); box-shadow: none; }

        .revealed-sentence-box {
            font-size: 1.45rem;
            font-weight: 700;
            color: #16a085;
            background: #e8f8f5;
            padding: 6px 18px;
            border-radius: 12px;
            border: 2px solid #a3e4d7;
            display: none;
        }

        /* All Cards Picker Grid (Mode 2) */
        .all-cards-grid {
            display: none;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }
        .all-cards-grid.active {
            display: grid;
        }
        .mini-card {
            background: white;
            border: 3px solid #f5deb3;
            border-radius: 18px;
            padding: 16px;
            cursor: pointer;
            transition: 0.15s;
            text-align: left;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .mini-card:hover {
            border-color: var(--primary-orange);
            transform: translateY(-2px);
            box-shadow: 0 6px 14px rgba(0,0,0,0.06);
        }
        .mini-card-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--dark-orange);
        }
        .mini-card-action {
            font-size: 0.95rem;
            color: #7f8c8d;
            font-family: 'Zen Maru Gothic', sans-serif;
            font-weight: 700;
        }

        @media (max-width: 850px) {
            .options-grid { grid-template-columns: repeat(2, 1fr); }
            .frame-text { font-size: 1.85rem; }
        }
        @media (max-width: 550px) {
            .main-container { padding: 16px 12px; }
            .all-cards-grid { grid-template-columns: 1fr; }
            .opt-card { min-height: 175px; padding: 12px 8px; }
            .opt-svg-box { width: 80px; height: 80px; }
            .opt-word { font-size: 1.15rem; }
        }
    </style>
</head>
<body>

<div class="main-container">
    <!-- Header -->
    <div class="header">
        <div class="header-titles">
            <h1 class="main-title">🎭 Momo - Scene 3 - Act & Speak!</h1>
            <h2 class="sub-title">カードを引いて、光ったマスを演じて話そう！</h2>
        </div>
        <div class="mode-controls">
            <button class="mode-btn active" id="btn-mode-game" onclick="setViewMode('game')">🎲 ランダム抽選モード</button>
            <button class="mode-btn" id="btn-mode-list" onclick="setViewMode('list')">🃏 カード一覧から選ぶ</button>
        </div>
    </div>

    <!-- Mode 1: Random Game View -->
    <div id="game-view" style="display: flex; flex-direction: column; gap: 16px;">
        <div class="action-bar">
            <button class="draw-btn" id="draw-btn" onclick="drawRandomCard()">
                🎲 Draw a Card! (カードを引く)
            </button>
            <button class="respin-btn" id="respin-btn" onclick="spinRouletteOnly()">
                ✨ ルーレットだけ回す
            </button>
            <span class="deck-badge" id="deck-counter">残り: 8 / 8 枚</span>
        </div>

        <div class="stage-card" id="stage-card">
            <div class="card-top-row">
                <span class="card-num-badge" id="card-badge">Card 1 / 8</span>
                <span class="action-hint-badge" id="card-action">🎬 Action: 指をさして驚こう！</span>
            </div>

            <div class="frame-box">
                <p class="frame-text" id="card-frame">Look at ( <span class="blank-slot">the clouds</span> )!</p>
                <div class="nuance-note" id="card-nuance" style="display:none;"></div>
            </div>

            <div class="options-grid" id="options-grid"></div>

            <div class="answer-panel">
                <div class="answer-buttons">
                    <button class="teacher-speak-btn" id="teacher-prompt-btn" style="display:none;" onclick="speakTeacherPrompt()">
                        <i class="fa-solid fa-ear-listen"></i> 🗣️ 先生の質問を聴く
                    </button>
                    <button class="reveal-btn" onclick="revealAndSpeakAnswer()">
                        <i class="fa-solid fa-volume-high"></i> 🔊 答えの英文を聴く
                    </button>
                </div>
                <div class="revealed-sentence-box" id="revealed-sentence">Look at the rainbow!</div>
            </div>
        </div>
    </div>

    <!-- Mode 2: All Cards Grid View -->
    <div class="all-cards-grid" id="list-view"></div>
</div>

    /* --- State --- */
    let currentCard = cardsData[0];
    let selectedOptIdx = 0;
    let remainingDeck = [];
    let isSpinning = false;
    let spinTimeoutId = null;

    /* --- Speech Synthesis --- */
    let preferredVoice = null;
    function loadVoices() {
        if (!('speechSynthesis' in window)) return;
        const voices = window.speechSynthesis.getVoices();
        if (voices.length === 0) return;
        const usVoices = voices.filter(v => v.lang === "en-US" || v.lang === "en_US" || v.lang.startsWith("en"));
        preferredVoice = 
            usVoices.find(v => v.name.includes("Ava")) ||
            usVoices.find(v => v.name.includes("Ana")) ||
            usVoices.find(v => v.name.includes("Jenny")) ||
            usVoices.find(v => v.name.includes("Google US English")) ||
            usVoices.find(v => v.name.includes("Samantha")) ||
            usVoices[0] || voices[0];
    }
    if (typeof window !== 'undefined' && window.speechSynthesis) {
        window.speechSynthesis.onvoiceschanged = loadVoices;
        loadVoices();
    }

    function speak(text) {
        if (!('speechSynthesis' in window)) return;
        if (!preferredVoice) loadVoices();
        window.speechSynthesis.cancel();
        const uttr = new SpeechSynthesisUtterance(text);
        if (preferredVoice) uttr.voice = preferredVoice;
        uttr.lang = 'en-US';
        uttr.rate = 0.65;
        uttr.pitch = 1.05;
        window.speechSynthesis.resume();
        window.speechSynthesis.speak(uttr);
    }

    /* --- Render Card --- */
    function renderCard(card, targetIdx = null) {
        currentCard = card;
        selectedOptIdx = targetIdx;

        document.getElementById('card-badge').textContent = `Card ${card.id} / 8`;
        document.getElementById('card-action').textContent = card.action;
        document.getElementById('card-frame').innerHTML = card.frameHtml;

        const nuanceEl = document.getElementById('card-nuance');
        if (card.nuance) {
            nuanceEl.textContent = card.nuance;
            nuanceEl.style.display = 'block';
        } else {
            nuanceEl.style.display = 'none';
        }

        const revBox = document.getElementById('revealed-sentence');
        revBox.style.display = 'none';

        const promptBtn = document.getElementById('teacher-prompt-btn');
        promptBtn.style.display = (card.id === 5) ? 'inline-flex' : 'none';

        const grid = document.getElementById('options-grid');
        grid.innerHTML = '';

        card.options.forEach((opt, idx) => {
            const div = document.createElement('div');
            div.className = 'opt-card' + (targetIdx === idx ? ' selected-target' : '');
            div.id = `opt-card-${idx}`;
            div.onclick = () => manualSelectOption(idx);

            div.innerHTML = `
                <div class="target-star-badge">⭐ HERE!</div>
                <div class="opt-svg-box">${opt.svg}</div>
                <div class="opt-word">${opt.label}</div>
                ${opt.sub ? `<div class="opt-sub-jp">${opt.sub}</div>` : ''}
            `;
            grid.appendChild(div);
        });
    }

    /* --- Manual Option Click --- */
    function manualSelectOption(idx) {
        if (isSpinning) return;
        selectedOptIdx = idx;
        document.querySelectorAll('.opt-card').forEach((el, i) => {
            el.classList.remove('selected-target', 'roulette-scanning');
            if (i === idx) el.classList.add('selected-target');
        });
        document.getElementById('revealed-sentence').style.display = 'none';
    }

    /* --- Fixed Roulette Animation --- */
    function runRouletteAnimation() {
        if (spinTimeoutId) {
            clearTimeout(spinTimeoutId);
            spinTimeoutId = null;
        }
        isSpinning = true;
        document.getElementById('draw-btn').disabled = true;
        document.getElementById('respin-btn').disabled = true;
        document.getElementById('revealed-sentence').style.display = 'none';

        const cards = document.querySelectorAll('.opt-card');
        cards.forEach(el => {
            el.classList.remove('selected-target', 'roulette-scanning');
        });

        const finalTarget = Math.floor(Math.random() * 4);
        const totalSteps = 12 + finalTarget; // 0 から totalSteps まで進むと、最後が必ず finalTarget になる
        let currentStep = 0;

        function tick() {
            const activeIdx = currentStep % 4;

            cards.forEach((el, i) => {
                el.classList.remove('roulette-scanning', 'selected-target');
                if (i === activeIdx) {
                    if (currentStep === totalSteps) {
                        el.classList.add('selected-target');
                    } else {
                        el.classList.add('roulette-scanning');
                    }
                }
            });

            if (currentStep >= totalSteps) {
                selectedOptIdx = finalTarget;
                isSpinning = false;
                spinTimeoutId = null;
                document.getElementById('draw-btn').disabled = false;
                document.getElementById('respin-btn').disabled = false;
                return;
            }

            currentStep++;
            const remaining = totalSteps - currentStep;
            const delay = remaining < 4 ? 190 : 85;
            spinTimeoutId = setTimeout(tick, delay);
        }

        tick();
    }

    /* --- Deck & Draw Logic --- */
    function refillDeck() {
        remainingDeck = [...cardsData].sort(() => Math.random() - 0.5);
    }

    function updateDeckBadge() {
        document.getElementById('deck-counter').textContent = `残り: ${remainingDeck.length} / 8 枚`;
    }

    function drawRandomCard() {
        if (isSpinning) return;
        if (remainingDeck.length === 0) {
            refillDeck();
        }
        const nextCard = remainingDeck.pop();
        updateDeckBadge();

        const stage = document.getElementById('stage-card');
        stage.classList.remove('card-pop');
        void stage.offsetWidth;
        stage.classList.add('card-pop');

        renderCard(nextCard, null);
        runRouletteAnimation();
    }

    function spinRouletteOnly() {
        if (isSpinning) return;
        runRouletteAnimation();
    }

    /* --- Answer & Teacher Audio --- */
    function revealAndSpeakAnswer() {
        const idx = (selectedOptIdx !== null) ? selectedOptIdx : 0;
        const opt = currentCard.options[idx];
        const revBox = document.getElementById('revealed-sentence');
        revBox.textContent = opt.fullEn;
        revBox.style.display = 'inline-block';
        speak(opt.fullEn);
    }

    function speakTeacherPrompt() {
        const idx = (selectedOptIdx !== null) ? selectedOptIdx : 0;
        const opt = currentCard.options[idx];
        if (opt.teacherPrompt) {
            speak(opt.teacherPrompt);
        }
    }

    /* --- View Mode Switching (Game vs All Cards) --- */
    function setViewMode(mode) {
        const gameView = document.getElementById('game-view');
        const listView = document.getElementById('list-view');
        const btnGame = document.getElementById('btn-mode-game');
        const btnList = document.getElementById('btn-mode-list');

        if (mode === 'game') {
            gameView.style.display = 'flex';
            listView.classList.remove('active');
            btnGame.classList.add('active');
            btnList.classList.remove('active');
        } else {
            gameView.style.display = 'none';
            listView.classList.add('active');
            btnGame.classList.remove('active');
            btnList.classList.add('active');
        }
    }

    function buildListView() {
        const listView = document.getElementById('list-view');
        listView.innerHTML = '';
        cardsData.forEach(card => {
            const item = document.createElement('div');
            item.className = 'mini-card';
            item.innerHTML = `
                <div class="mini-card-title">Card ${card.id}: ${card.frameHtml.replace(/<[^>]+>/g, '')}</div>
                <div class="mini-card-action">${card.action}</div>
            `;
            item.onclick = () => {
                setViewMode('game');
                renderCard(card, null);
                runRouletteAnimation();
            };
            listView.appendChild(item);
        });
    }

    // Initialize
    refillDeck();
    buildListView();
    drawRandomCard();
</script>
