<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phonics Lesson - Winter Scene 8 - Townspeople</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
            background: linear-gradient(135deg, #e0f7fa, #ffffff, #f3e5f5);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; margin: 0; text-align: center;
        }
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .card {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px; border-radius: 40px;
            box-shadow: 0 15px 50px rgba(0,0,0,0.1);
            width: 90%; max-width: 750px;
            position: relative;
        }
        .word-display { font-size: 5.5rem; font-weight: bold; margin: 10px 0; min-height: 130px; }
        .translation { font-size: 2rem; color: #666; margin-bottom: 25px; height: 2.5rem; }
        .phrase-display { font-size: 3.2rem; font-weight: bold; color: #2c3e50; line-height: 1.5; padding: 20px; }
        
        .unit { display: inline-block; transition: 0.3s; color: #ddd; margin: 0 3px; }
        .active { color: #ff4757; transform: scale(1.15); text-decoration: underline; text-underline-offset: 8px; }
        
        .btn {
            padding: 18px 45px; font-size: 1.6rem; border-radius: 100px;
            border: none; cursor: pointer; margin: 10px; font-weight: bold;
            transition: all 0.2s; box-shadow: 0 8px 0 #bbb;
        }
        .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #bbb; }
        
        .btn-yes { background: #2ed573; color: white; box-shadow: 0 8px 0 #26af5c; }
        .btn-no { background: #ff4757; color: white; box-shadow: 0 8px 0 #d63031; }
        .btn-next { background: #ffa502; color: white; box-shadow: 0 8px 0 #e67e22; }
        
        #guide { font-size: 1.6rem; color: #444; margin-bottom: 10px; font-weight: bold; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="card">
    <div id="guide">Can you read it?</div>
    <div id="display" class="word-display"></div>
    <div id="translation" class="translation"></div>

    <div id="btns-init">
        <button class="btn btn-yes" onclick="ansYes()">Yes! 👍</button>
        <button class="btn btn-no" onclick="ansNo()">No 😢</button>
    </div>
    <div id="btns-step" class="hidden">
        <button class="btn btn-next" onclick="doNext()">Next Step ➔</button>
    </div>
    <div id="btns-final" class="hidden">
        <button class="btn btn-yes" id="main-btn" onclick="nextContent()">Next Word 🚀</button>
    </div>
</div>

<script>
    // 単語リストと先生指定の区切り
    const wordList = [
        { w: "snowman", t: "雪だるま", s: ["s", "n", "ow", "ma", "n"] },
        { w: "that", t: "あれ/その", s: ["th", "at"] },
        { w: "never", t: "一度もない", s: ["ne", "ver"] },
        { w: "melt", t: "とける", s: ["me", "l", "t"] },
        { w: "impossible", t: "不可能", s: ["im", "po", "ssi", "ble"] },
        { w: "secret", t: "ひみつ", s: ["se", "c", "re", "t"] },
        { w: "ingredient", t: "材料", s: ["in", "gre", "di", "ent"] }
    ];

    // フレーズリスト
    const phraseList = [
        { w: "A snowman that never melts?", t: "決して溶けない雪だるま？" },
        { w: "That's impossible!", t: "そんなの不可能だよ！" },
        { w: "A secret ingredient?", t: "秘密の材料？" }
    ];

    let currentIdx = -1;
    let currentStep = 0;
    let mode = "word"; 

    function speak(txt, rate = 0.7) {
        window.speechSynthesis.cancel();
        let u = new SpeechSynthesisUtterance(txt);
        u.lang = "en-US";
        u.rate = rate;
        u.pitch = 1.1;
        window.speechSynthesis.speak(u);
    }

    function nextContent() {
        if (mode === "word") {
            currentIdx++;
            if (currentIdx < wordList.length) {
                setupWord();
            } else {
                mode = "phrase";
                currentIdx = 0;
                setupPhrase();
            }
        } else {
            currentIdx++;
            if (currentIdx < phraseList.length) {
                setupPhrase();
            } else {
                finish();
            }
        }
    }

    // --- 単語パート ---
    function setupWord() {
        currentStep = -1;
        document.getElementById('guide').textContent = "Can you read it?";
        document.getElementById('display').className = "word-display";
        document.getElementById('display').textContent = wordList[currentIdx].w;
        document.getElementById('translation').textContent = `( ${wordList[currentIdx].t} )`;
        
        document.getElementById('btns-init').classList.remove('hidden');
        document.getElementById('btns-step').classList.add('hidden');
        document.getElementById('btns-final').classList.add('hidden');
        speak("Can you read it?");
    }

    function ansYes() {
        confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
        speak(wordList[currentIdx].w);
        showFinalBtn();
    }

    function ansNo() {
        currentStep = 0;
        document.getElementById('btns-init').classList.add('hidden');
        document.getElementById('btns-step').classList.remove('hidden');
        renderUnits();
    }

    function renderUnits() {
        let h = "";
        wordList[currentIdx].s.forEach((u, i) => {
            h += `<span class="unit ${i === currentStep ? 'active' : ''}">${u}</span>`;
        });
        document.getElementById('display').innerHTML = h;
        // 音は先生が出すので、ここでは鳴らしません
    }

    function doNext() {
        currentStep++;
        if (currentStep >= wordList[currentIdx].s.length) {
            document.getElementById('display').textContent = wordList[currentIdx].w;
            speak(wordList[currentIdx].w);
            showFinalBtn();
        } else {
            renderUnits();
        }
    }

    // --- フレーズパート ---
    function setupPhrase() {
        document.getElementById('guide').textContent = "Let's read!";
        const area = document.getElementById('display');
        area.className = "phrase-display";
        area.textContent = phraseList[currentIdx].w;
        document.getElementById('translation').textContent = `( ${phraseList[currentIdx].t} )`;
        
        document.getElementById('btns-init').classList.add('hidden');
        document.getElementById('btns-step').classList.add('hidden');
        document.getElementById('btns-final').classList.remove('hidden');
        document.getElementById('main-btn').textContent = "Next Sentence ➔";
        
        speak(phraseList[currentIdx].w, 0.8);
    }

    function showFinalBtn() {
        document.getElementById('btns-step').classList.add('hidden');
        document.getElementById('btns-final').classList.remove('hidden');
        document.getElementById('main-btn').textContent = "Next Word 🚀";
    }

    function finish() {
        document.getElementById('guide').textContent = "Wonderful!";
        document.getElementById('display').textContent = "Great Reader! 🏆";
        document.getElementById('translation').textContent = "全部読めたね！お疲れ様！";
        document.getElementById('btns-final').classList.add('hidden');
        speak("Excellent! You did a great job today!");
        confetti({ particleCount: 250, spread: 150 });
    }

    // 初回起動
    nextContent();

</script>
</body>
</html>
