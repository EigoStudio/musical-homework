<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spring Dialogues - Inspired by Spring, Scene 1</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --bg-color: linear-gradient(135deg, #e3f2fd, #bbdefb);
            --theme-color: #2196f3;
        }
        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
            background: var(--bg-color);
            display: flex; justify-content: center; align-items: center;
            height: 100vh; margin: 0; text-align: center;
            transition: background 0.5s;
        }
        .card {
            background: white; padding: 40px; border-radius: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15); width: 85%; max-width: 800px;
        }
        .title { font-size: 1.2rem; color: #555; margin-bottom: 10px; }
        .dialogue-display { 
            font-size: 2.5rem; font-weight: bold; color: #2c3e50; 
            line-height: 1.4; min-height: 140px; display: flex; 
            flex-direction: column; justify-content: center; align-items: center;
        }
        .trans { font-size: 1.6rem; color: #888; margin-top: 10px; min-height: 2rem; }
        
        .btn {
            padding: 15px 40px; font-size: 1.5rem; border-radius: 50px;
            border: none; cursor: pointer; margin: 10px; font-weight: bold;
            display: inline-block; transition: 0.1s;
        }
        .btn:active { transform: translateY(4px); }

        .btn-p1 { background: #ffa502; color: white; box-shadow: 0 6px 0 #e67e22; }
        .btn-p2 { background: #ff9ff3; color: white; box-shadow: 0 6px 0 #f368e0; }
        .btn-p3 { background: #ee5253; color: white; box-shadow: 0 6px 0 #c0392b; }
        .btn-p4 { background: #10ac84; color: white; box-shadow: 0 6px 0 #0b8e6d; }
        
        .btn-next { background: var(--theme-color); color: white; box-shadow: 0 6px 0 #1976d2; }
        .btn-speaker { 
            background: #2196f3; color: white; font-size: 2.5rem; 
            border-radius: 50%; width: 90px; height: 90px; 
            display: flex; align-items: center; justify-content: center;
            margin: 20px auto; border: none; box-shadow: 0 6px 0 #1976d2;
        }
        .btn-print { background: #555; color: white; box-shadow: 0 6px 0 #333; margin-top: 20px; font-size: 1rem; padding: 10px 20px; }

        .hidden { display: none !important; }
        .full-text { font-size: 1.8rem; text-align: left; margin: 20px 0; line-height: 1.8; color: #2c3e50; }

        #print-content { display: none; text-align: left; padding: 10mm; }

        @media print {
            body { background: white !important; height: auto; display: block; }
            .card, #menu, #game-area, .btn, .no-print { display: none !important; }
            #print-content { display: block !important; }
            h1 { font-size: 22pt; border-bottom: 2px solid #000; padding-bottom: 10px; margin-bottom: 40px; text-align: center; }
            .print-part { margin-bottom: 35px; }
            .print-part-title { font-weight: bold; font-size: 16pt; border-left: 5px solid #000; padding-left: 10px; display: block; margin-bottom: 15px; }
            .print-line { font-size: 18pt; line-height: 1.5; margin-bottom: 8px; color: black !important; padding-left: 15px; }
            .print-translation-area { margin-top: 50px; border-top: 1px dashed #666; padding-top: 15px; page-break-inside: avoid; }
            .print-translation-title { font-size: 11pt; font-weight: bold; margin-bottom: 10px; }
            .print-trans-item { font-size: 10pt; color: #333 !important; margin-bottom: 4px; line-height: 1.4; }
        }
    </style>
</head>
<body>

<div class="card">
    <div id="menu">
        <h2 style="font-size: 2rem; color: #333; margin-bottom: 30px;">Choose a Dialogue 🌸</h2>
        <button class="btn btn-p1" onclick="startDialogue(0)">Part 1: Sunny Day</button><br>
        <button class="btn btn-p2" onclick="startDialogue(1)">Part 2: Cherry Blossoms</button><br>
        <button class="btn btn-p3" onclick="startDialogue(2)">Part 3: Lunchtime</button><br>
        <button class="btn btn-p4" onclick="startDialogue(3)">Part 4: It's Hot!</button><br>
        <button class="btn btn-print" onclick="window.print()">🖨 Print</button>
    </div>

    <div id="game-area" class="hidden">
        <div id="part-title" class="title"></div>
        <div id="display" class="dialogue-display"></div>
        <div id="trans" class="trans"></div>
        
        <button class="btn btn-speaker" onclick="speakCurrent()">🔊</button>
        
        <div id="nav-btns" style="margin-top: 20px;">
            <button id="next-btn" class="btn btn-next" onclick="nextSentence()">Next ➔</button>
            <button class="btn" style="background:#ccc; box-shadow: 0 6px 0 #999; color:white;" onclick="resetMenu()">Menu</button>
        </div>
    </div>
</div>

<div id="print-content">
    <h1>Spring Dialogues - Inspired by Spring, Scene 1</h1>
    <div id="print-body"></div>
    <div class="print-translation-area">
        <div class="print-translation-title">【和訳】</div>
        <div id="print-trans-body"></div>
    </div>
</div>

<script>
    const dialogues = [
        {
            title: "Part 1: Sunny Day",
            bg: "linear-gradient(135deg, #fff5e6, #ffcc80)", theme: "#ffa502",
            lines: [
                { en: "A: It's sunny!", ja: "いい天気！" },
                { en: "B: It's warm!", ja: "あったかいね！" },
                { en: "A: Let's play outside!", ja: "お外で遊ぼう！" },
                { en: "B: Okay!", ja: "オッケー！" }
            ]
        },
        {
            title: "Part 2: Cherry Blossoms",
            bg: "linear-gradient(135deg, #fff0f6, #f8bbd0)", theme: "#ff9ff3",
            lines: [
                { en: "A: Look! Cherry blossoms!", ja: "見て！桜だよ！" },
                { en: "B: Spring is here!", ja: "春が来たね！" }
            ]
        },
        {
            title: "Part 3: Lunchtime",
            bg: "linear-gradient(135deg, #fffde7, #fff59d)", theme: "#ee5253",
            lines: [
                { en: "A: Lunchtime is almost here!", ja: "もう少しで昼食時間だよ！" },
                { en: "B: Yay! I can't wait!", ja: "わーい、楽しみ！" }
            ]
        },
        {
            title: "Part 4: It's Hot!",
            bg: "linear-gradient(135deg, #e8f5e9, #a5d6a7)", theme: "#10ac84",
            lines: [
                { en: "A: It's hot! And I'm tired!", ja: "暑い！それに疲れちゃった！" },
                { en: "B: Let's sit underneath the tree!", ja: "あの木の下に座ろうよ！" },
                { en: "A: Good idea!", ja: "いい考えだね！" }
            ]
        }
    ];

    function preparePrint() {
        const printBody = document.getElementById('print-body');
        const transBody = document.getElementById('print-trans-body');
        printBody.innerHTML = '';
        transBody.innerHTML = '';

        dialogues.forEach((part, index) => {
            let partHtml = `<div class="print-part"><span class="print-part-title">${part.title}</span>`;
            part.lines.forEach(line => {
                partHtml += `<div class="print-line">${line.en}</div>`;
                const transItem = document.createElement('div');
                transItem.className = 'print-trans-item';
                transItem.innerText = `${line.en} → ${line.ja}`;
                transBody.appendChild(transItem);
            });
            partHtml += `</div>`;
            printBody.innerHTML += partHtml;
        });
    }

    preparePrint();
    window.onbeforeprint = preparePrint;

    // --- 音声ロジックを Froggy バージョンに完全統一 ---
    function getFemaleVoice() {
        const voices = window.speechSynthesis.getVoices();
        const preferred = ["Google US English", "Microsoft Zira", "Samantha", "Female"];
        let selected = null;
        for (let name of preferred) {
            selected = voices.find(v => (v.lang === 'en-US' || v.lang === 'en_US') && v.name.includes(name));
            if (selected) break;
        }
        return selected || voices.find(v => v.lang.startsWith('en'));
    }

    // 音声リストの更新を待機
    window.speechSynthesis.onvoiceschanged = getFemaleVoice;

    function speak(txt) {
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(txt.replace(/^[AB]:\s*/i, ''));
        const v = getFemaleVoice();
        if (v) u.voice = v;
        u.lang = 'en-US';
        u.rate = 0.6; // 最初のファイルと同じ速度
        window.speechSynthesis.speak(u);
    }

    function startDialogue(idx) {
        currentPart = idx;
        currentLine = 0;
        const data = dialogues[idx];
        document.body.style.background = data.bg;
        document.documentElement.style.setProperty('--theme-color', data.theme);
        document.getElementById('menu').classList.add('hidden');
        document.getElementById('game-area').classList.remove('hidden');
        document.getElementById('next-btn').classList.remove('hidden');
        document.getElementById('part-title').textContent = data.title;
        updateDisplay();
    }

    function updateDisplay() {
        const data = dialogues[currentPart];
        if (currentLine < data.lines.length) {
            document.getElementById('display').innerText = data.lines[currentLine].en;
            document.getElementById('trans').innerText = data.lines[currentLine].ja;
            document.getElementById('next-btn').textContent = "Next ➔";
        } else {
            showSummary();
        }
    }

    function speakCurrent() {
        const data = dialogues[currentPart];
        if (currentLine < data.lines.length) speak(data.lines[currentLine].en);
        else speak(data.lines.map(l => l.en.replace(/^[AB]:\s*/i, '')).join(". "));
    }

    function nextSentence() { currentLine++; updateDisplay(); }

    function showSummary() {
        const data = dialogues[currentPart];
        let fullHtml = "<div class='full-text'>";
        data.lines.forEach(l => { fullHtml += `<div>${l.en}<br><span style="font-size:1.2rem; color:#888;">${l.ja}</span></div>`; });
        fullHtml += "</div>";
        document.getElementById('display').innerHTML = fullHtml;
        document.getElementById('trans').innerText = "Excellent! Click 🔊 to hear all.";
        document.getElementById('next-btn').classList.add('hidden');
        confetti({ particleCount: 150, spread: 70 });
    }

    function resetMenu() {
        document.getElementById('menu').classList.remove('hidden');
        document.getElementById('game-area').classList.add('hidden');
        document.body.style.background = "linear-gradient(135deg, #e3f2fd, #bbdefb)";
        window.speechSynthesis.cancel();
    }
</script>
</body>
</html>
