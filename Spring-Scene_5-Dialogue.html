<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spring - Scene 5 - Fortune Works Miracles</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { 
    --bg: #f5f5f5; /* 灰色 */
    --pink-light: #fce4ec; /* 薄いピンク */
    --pink-strong: #f06292; /* 濃いピンク */
    --branch: #5d4037; /* 茶色 */
    --magic-yellow: #fff9c4; /* 黄色 */
    --ans: #c2185b; 
  }
  body { font-family: 'Zen Maru Gothic', sans-serif; background: var(--bg); display: flex; justify-content: center; padding: 15px; margin: 0; }
  .container { width: 100%; max-width: 700px; background: rgba(255,255,255,0.95); padding: 20px; border-radius: 25px; border: 4px solid var(--branch); box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
  .nav { display: flex; gap: 5px; margin-bottom: 15px; flex-wrap: wrap; justify-content: center; }
  .nav-btn { flex: 1; min-width: 80px; padding: 8px; border: 2px solid var(--pink-light); background: white; border-radius: 12px; cursor: pointer; font-size: 0.7rem; font-weight: bold; }
  .nav-btn.active { background: var(--pink-strong); color: white; }
  .chat-box { min-height: 400px; max-height: 500px; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 12px; background: #fff; border-radius: 15px; border: 2px solid var(--pink-light); margin-bottom: 15px; }
  .bubble { max-width: 85%; padding: 12px; border-radius: 18px; line-height: 1.5; font-size: 0.95rem; box-shadow: 2px 2px 5px rgba(0,0,0,0.05); }
  
  /* ロール別カラー */
  .luna { align-self: flex-start; background: #eeeeee; border: 2px solid #bdbdbd; } 
  .chorus { align-self: center; background: var(--magic-yellow); border: 2px solid #fbc02d; width: 90%; text-align: center; }
  .fortune { align-self: flex-end; background: var(--pink-light); border: 2px solid var(--pink-strong); }
  .sparrows { align-self: flex-start; background: #efebe9; border: 2px solid var(--branch); }
  
  .role-name { font-size: 0.7rem; font-weight: bold; color: var(--branch); margin-bottom: 4px; display: block; }
  .jp { font-size: 0.8rem; color: #78909c; display: block; margin-top: 5px; border-top: 1px solid #eee; padding-top: 3px; }
  .blank { display: inline-block; background: #e0e0e0; min-width: 45px; height: 1.1em; vertical-align: middle; border-radius: 4px; }
  .controls { display: flex; flex-direction: column; gap: 10px; }
  .btn { padding: 12px; border: none; background: var(--branch); color: white; border-radius: 50px; font-weight: bold; cursor: pointer; font-size: 1rem; box-shadow: 0 4px 0 #3e2723; transition: 0.1s; width: 100%; }
  .btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #3e2723; }
  .btn-s { font-size: 0.7rem; padding: 8px; flex: 1; }
  .tts-btn { background: var(--pink-strong); box-shadow: 0 4px 0 #ad1457; }
  strong.ans { color: var(--ans); text-decoration: underline; }
</style>
</head>
<body>

<div class="container">
  <div class="nav" id="navContainer"></div>
  <h4 id="partTitle" style="text-align:center; color:var(--branch); margin:0 0 10px 0;">🌸 Spring Scene 5 🌸</h4>
  <div class="chat-box" id="chatBox"></div>
  
  <div class="controls">
    <button class="btn" id="actionBtn" onclick="handleAction()">スタート！</button>
    <div style="display: flex; gap: 5px;">
      <button class="btn btn-s tts-btn" id="ttsBtn" onclick="toggleTTS()">音声: ON</button>
      <button class="btn btn-s" style="background:#ffa726; box-shadow:0 4px 0 #ef6c00;" onclick="repeatSpeech()">リピート ⟲</button>
      <div style="flex:1; text-align:center;">
        <label style="font-size: 0.6rem; display:block;">Speed</label>
        <input type="range" id="speedRange" min="0.5" max="1.2" step="0.1" value="1.0" style="width:100%;">
      </div>
    </div>
  </div>
</div>

<script>
let ttsEnabled = true, lastSpokenText = "", pIdx = 0, sIdx = 0, waiting = false;
const parts = [
  {
    title: "Spring - Scene 5 - Fortune Works Miracles Part 1",
    steps: [
      { role: "Luna", en: "Hush... do you <span class='blank'></span> the <span class='blank'></span>?", ans: ["feel", "chill"], jp: "静かに…冷気を感じる？" },
      { role: "Luna", en: "The air is <span class='blank'></span>, the world is <span class='blank'></span>.", ans: ["quiet", "still"], jp: "空気は静まり、世界は止まっている。" },
      { role: "Luna", en: "But look at <span class='blank'></span>, she has the <span class='blank'></span>,", ans: ["Fortune", "will"], jp: "でもフォーチュンを見て、彼女には意志がある！" },
      { role: "Luna", en: "To bring the <span class='blank'></span> back to the <span class='blank'></span>!", ans: ["magic", "hill"], jp: "丘に魔法を取り戻すために！" }
    ]
  },
  {
    title: "Spring - Scene 5 - Fortune Works Miracles Part 2",
    steps: [
      { role: "Chorus", en: "The <span class='blank'></span> curse will <span class='blank'></span>,", ans: ["silver", "disappear"], jp: "銀色の呪いは消え去り、" },
      { role: "Chorus", en: "Don't <span class='blank'></span> your eyes, the <span class='blank'></span> is here!", ans: ["blink", "miracle"], jp: "まばたきしないで、奇跡はここにある！" },
      { role: "Fortune", en: "I see the <span class='blank'></span> that look so <span class='blank'></span>,", ans: ["branches", "sad"], jp: "とても悲しそうに見える枝が見えます。" },
      { role: "Fortune", en: "The silver <span class='blank'></span> made the world look <span class='blank'></span>.", ans: ["powder", "bad"], jp: "銀色の粉が世界を悪く見せていた。" },
      { role: "Fortune", en: "I have a <span class='blank'></span> to make it <span class='blank'></span>,", ans: ["secret", "right"], jp: "それを直すための秘密があるの。" },
      { role: "Fortune", en: "To bring the <span class='blank'></span> into the <span class='blank'></span>!", ans: ["blossoms", "light"], jp: "花たちを光の中へ連れてくるために！" },
      { role: "Fortune", en: "Bloom, <span class='blank'></span> <span class='blank'></span>!", ans: ["cherry", "blossoms"], jp: "咲け、桜の花たち！" }
    ]
  },
  {
    title: "Spring - Scene 5 - Fortune Works Miracles Part 3",
    steps: [
      { role: "Chorus", en: "Wow! They're so <span class='blank'></span>! The pink is <span class='blank'></span>!", ans: ["pretty", "back"], jp: "わあ！とっても綺麗！ピンクが戻ってきた！" },
      { role: "Chorus", en: "Thank you, <span class='blank'></span>!", ans: ["Fortune"], jp: "ありがとう、フォーチュン！" },
      { role: "Sparrows", en: "Pink, pink, pink. I <span class='blank'></span> pink.", ans: ["like"], jp: "ピンク、ピンク、ピンク。ピンクが好き。" },
      { role: "Sparrows", en: "Pink is my <span class='blank'></span> <span class='blank'></span>!", ans: ["favorite", "color"], jp: "ピンクは私の一番好きな色！" },
      { role: "Sparrows", en: "Do you like pink? (Yes, I <span class='blank'></span>!)", ans: ["do"], jp: "ピンクは好き？（はい、好きです！）" },
      { role: "Sparrows", en: "I <span class='blank'></span> and <span class='blank'></span> when I see pink.", ans: ["blink", "wink"], jp: "ピンクを見るとパチパチしてウィンクしちゃう。" },
      { role: "Sparrows", en: "Blink, <span class='blank'></span>, pink!", ans: ["wink"], jp: "パチパチ、ウィンク、ピンク！" }
    ]
  }
];

function setupNav() {
  const nav = document.getElementById('navContainer');
  nav.innerHTML = "";
  parts.forEach((p, i) => {
    const b = document.createElement('button');
    b.className = `nav-btn ${i===0?'active':''}`;
    b.textContent = `Part ${i+1}`;
    b.onclick = () => switchPart(i);
    nav.appendChild(b);
  });
}

function switchPart(n) {
  pIdx = n; sIdx = 0; waiting = false;
  document.querySelectorAll('.nav-btn').forEach((b, i) => b.classList.toggle('active', i === n));
  document.getElementById('partTitle').textContent = parts[n].title;
  document.getElementById('chatBox').innerHTML = "";
  document.getElementById('actionBtn').textContent = "練習をはじめる";
}

function toggleTTS() {
  ttsEnabled = !ttsEnabled;
  const btn = document.getElementById('ttsBtn');
  btn.textContent = ttsEnabled ? "音声: ON" : "音声: OFF";
  btn.style.background = ttsEnabled ? "var(--pink-strong)" : "#ccc";
}

function speak(text) {
  if (!ttsEnabled) return;
  window.speechSynthesis.cancel();
  const uttr = new SpeechSynthesisUtterance(text);
  uttr.lang = 'en-US';
  uttr.rate = document.getElementById('speedRange').value;
  lastSpokenText = text;
  window.speechSynthesis.speak(uttr);
}

function repeatSpeech() { if (lastSpokenText) speak(lastSpokenText); }

function handleAction() {
  const current = parts[pIdx];
  const btn = document.getElementById('actionBtn');
  if (sIdx >= current.steps.length) {
    if (pIdx < parts.length - 1) switchPart(pIdx + 1);
    else switchPart(0);
    return;
  }
  const step = current.steps[sIdx];
  if (!waiting) {
    addBubble(step.role, step.en, step.jp);
    btn.textContent = "答えをチェック！";
    waiting = true;
  } else {
    const bubbles = document.querySelectorAll('.bubble');
    const lastEnSpan = bubbles[bubbles.length - 1].querySelector('.en');
    let fullText = step.en;
    step.ans.forEach(a => { fullText = fullText.replace("<span class='blank'></span>", a); });
    let coloredText = step.en;
    step.ans.forEach(a => { coloredText = coloredText.replace("<span class='blank'></span>", `<strong class="ans">${a}</strong>`); });
    lastEnSpan.innerHTML = coloredText;
    speak(fullText);
    waiting = false; sIdx++;
    btn.textContent = (sIdx >= current.steps.length) ? "つぎのセクションへ ➔" : "つぎのセリフ";
  }
}

function addBubble(role, en, jp) {
  const box = document.getElementById('chatBox');
  const div = document.createElement('div');
  div.className = `bubble ${role.toLowerCase()}`;
  div.innerHTML = `<span class="role-name">${role}</span><span class="en">${en}</span><span class="jp">${jp}</span>`;
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}

window.onload = () => { setupNav(); switchPart(0); };
</script>
</body>
</html>
