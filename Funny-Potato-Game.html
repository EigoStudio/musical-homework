<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Funny Potato Game</title>
 <script src="auth.js"></script>
<style>
  * { box-sizing: border-box; user-select: none; }
  body {
    font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
    background-color: #2c3e50;
    color: #fff;
    margin: 0;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
  }

  /* Header Row */
  .header-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 880px;
    margin-bottom: 15px;
  }
  h1 { margin: 0; color: #f1c40f; text-shadow: 2px 2px #c0392b; font-size: 2.2rem; }

  .print-btn {
    background: #2ecc71;
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: 50px;
    cursor: pointer;
    font-size: 1.1rem;
    font-weight: bold;
    box-shadow: 0 4px #27ae60;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    transition: transform 0.1s;
  }
  .print-btn:active { transform: translateY(2px); box-shadow: none; }

  /* Navigation Modes */
  .mode-nav {
    display: flex;
    gap: 15px;
    margin-bottom: 20px;
  }
  .nav-btn {
    padding: 12px 24px;
    font-size: 1.2rem;
    font-weight: bold;
    border: none;
    border-radius: 12px;
    background: #e67e22;
    color: white;
    cursor: pointer;
    box-shadow: 0 5px #d35400;
    transition: all 0.1s;
  }
  .nav-btn.active {
    background: #27ae60;
    box-shadow: 0 5px #1e8449;
    transform: translateY(2px);
  }

  /* Main Blackboard Container */
  #board {
    position: relative;
    width: 880px;
    height: 540px;
    background-color: #34495e;
    border: 8px solid #7f8c8d;
    border-radius: 20px;
    display: flex;
    justify-content: space-between;
    padding: 20px;
    overflow: hidden;
  }

  /* Potato Stage Left */
  #stage {
    position: relative;
    width: 480px;
    height: 100%;
    background: #ffffff;
    border-radius: 15px;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
  }

  /* Black Dotted Guide Outline */
  .outline-potato {
    width: 260px;
    height: 340px;
    fill: none;
    stroke: #2c3e50;
    stroke-width: 4;
    stroke-dasharray: 8 6;
  }

  .part-layer {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }

  /* Right Control Panel */
  #controls {
    width: 340px;
    display: flex;
    flex-direction: column;
    gap: 15px;
  }

  .instruction-box {
    background: #f39c12;
    padding: 12px;
    border-radius: 12px;
    font-size: 1.3rem;
    font-weight: bold;
    text-align: center;
    color: #2c3e50;
    min-height: 85px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    box-shadow: 0 4px rgba(0,0,0,0.2);
  }

  .big-speaker-btn {
    background: #9b59b6;
    color: white;
    border: none;
    width: 60px;
    height: 60px;
    border-radius: 50%;
    font-size: 1.8rem;
    cursor: pointer;
    box-shadow: 0 4px #763e8f;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .big-speaker-btn:active { transform: translateY(2px); box-shadow: none; }

  /* Grid of Visual Picture Cards */
  .button-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    max-height: 360px;
    overflow-y: auto;
    padding: 5px;
  }

  .card-btn {
    background: #ffffff;
    border: 3px solid #bdc3c7;
    border-radius: 12px;
    height: 90px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 4px #95a5a6;
    transition: transform 0.1s, border-color 0.2s;
  }
  .card-btn:active { transform: translateY(2px); box-shadow: none; }
  .card-btn svg { width: 60px; height: 60px; }

  /* Mode 3 Curtain */
  #curtain {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: #c0392b;
    color: white;
    font-size: 2.5rem;
    font-weight: bold;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 10;
  }

  /* Celebration Overlay */
  #celebration {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(46, 204, 113, 0.95);
    color: white;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 20;
    text-align: center;
    padding: 20px;
  }
  #celebration h2 { font-size: 2.5rem; margin: 0 0 15px 0; color: #f1c40f; text-shadow: 2px 2px #27ae60; }
  #celebration p { font-size: 1.5rem; margin: 0 0 25px 0; }
  .replay-btn {
    padding: 15px 30px;
    font-size: 1.3rem;
    font-weight: bold;
    background: #e67e22;
    color: white;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    box-shadow: 0 5px #d35400;
  }

  .hidden { display: none !important; }

  /* Monochrome Print View Styles */
  .print-only { display: none; }

  @media print {
    body * { visibility: hidden !important; }
    .print-only, .print-only * { visibility: visible !important; }
    .print-only {
      display: flex !important;
      flex-direction: column;
      align-items: center;
      position: absolute;
      left: 0; top: 0; width: 100%;
      color: #000 !important;
      background: #fff !important;
      font-family: 'Comic Sans MS', sans-serif !important;
      padding: 5mm;
    }
    .print-header {
      text-align: center;
      width: 100%;
      border-bottom: 3px solid #000;
      padding-bottom: 8px;
      margin-bottom: 12px;
    }
    .print-header h1 { font-size: 28pt; margin: 0; color: #000; text-shadow: none; }
    .print-fields {
      display: flex;
      justify-content: space-between;
      width: 100%;
      font-size: 15pt;
      font-weight: bold;
      margin-bottom: 15px;
    }
    .print-layout {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      margin-top: 10px;
    }
    .print-drawing-box {
      width: 100%;
      height: 780px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
    }
  }
</style>
</head>
<body>

  <!-- Top Header Row -->
  <div class="header-row">
    <h1>🥔 Let's Build a Funny Potato</h1>
    <button class="print-btn" onclick="window.print()">
      🖨️ Print Coloring Sheet
    </button>
  </div>

  <!-- Navigation -->
  <div class="mode-nav">
    <button class="nav-btn active" onclick="setMode(1)">1. Learn Vocab</button>
    <button class="nav-btn" onclick="setMode(2)">2. Listen & Find</button>
    <button class="nav-btn" onclick="setMode(3)">3. What's Missing?</button>
  </div>

  <!-- Main Board Area -->
  <div id="board">
    <!-- Stage Area Left -->
    <div id="stage">
      <!-- Black Dotted Outline Guide -->
      <svg class="outline-potato" viewBox="0 0 200 280">
        <path d="M 100 20 C 160 20, 180 80, 180 150 C 180 230, 150 260, 100 260 C 50 260, 20 230, 20 150 C 20 80, 40 20, 100 20 Z" />
      </svg>

      <!-- SVG Layer for Parts -->
      <svg id="potato-parts" class="part-layer" viewBox="0 0 480 500">
        <!-- Big Brown Face (Base Potato Body) -->
        <g id="svg-face" class="hidden">
          <path d="M 240 100 C 320 100, 350 175, 350 270 C 350 375, 310 415, 240 415 C 170 415, 130 375, 130 270 C 130 175, 160 100, 240 100 Z" fill="#b37d4e" stroke="#6d4c2d" stroke-width="6"/>
        </g>
        <!-- Black Hat -->
        <g id="svg-hat" class="hidden">
          <path d="M 180 100 L 300 100 L 300 55 C 300 35, 180 35, 180 55 Z" fill="#2c3e50" />
          <ellipse cx="240" cy="100" rx="85" ry="14" fill="#2c3e50" />
        </g>
        <!-- Two Thick Eyebrows -->
        <g id="svg-eyebrows" class="hidden">
          <rect x="180" y="130" width="45" height="12" rx="5" fill="#2c3e50" transform="rotate(-5 180 130)" />
          <rect x="255" y="126" width="45" height="12" rx="5" fill="#2c3e50" transform="rotate(5 255 126)" />
        </g>
        <!-- Googly Eyes -->
        <g id="svg-googly-eyes" class="hidden">
          <circle cx="200" cy="160" r="22" fill="white" stroke="black" stroke-width="3"/>
          <circle cx="200" cy="160" r="8" fill="black"/>
          <circle cx="280" cy="160" r="22" fill="white" stroke="black" stroke-width="3"/>
          <circle cx="280" cy="160" r="8" fill="black"/>
        </g>
        <!-- Pear-Shaped Big Orange Nose -->
        <g id="svg-nose" class="hidden">
          <path d="M 240 195 C 228 195, 222 210, 208 230 C 195 250, 210 265, 240 265 C 270 265, 285 250, 272 230 C 258 210, 252 195, 240 195 Z" fill="#e67e22" stroke="#d35400" stroke-width="3"/>
        </g>
        <!-- Black Mustache -->
        <g id="svg-mustache" class="hidden">
          <path d="M 240 270 Q 210 245, 160 275 Q 210 295, 240 278 Q 270 295, 320 275 Q 270 245, 240 270 Z" fill="#111" />
        </g>
        <!-- Wide Big Red Mouth (Straight Pearly Teeth) -->
        <g id="svg-mouth" class="hidden">
          <path d="M 160 300 Q 240 380, 320 300 Z" fill="#e74c3c" stroke="#c0392b" stroke-width="5" />
          <path d="M 172 300 L 308 300 L 302 322 Q 240 330, 178 322 Z" fill="white" stroke="#333" stroke-width="2" />
          <line x1="199" y1="300" x2="199" y2="324" stroke="#333" stroke-width="1.5" />
          <line x1="226" y1="300" x2="226" y2="327" stroke="#333" stroke-width="1.5" />
          <line x1="254" y1="300" x2="254" y2="327" stroke="#333" stroke-width="1.5" />
          <line x1="281" y1="300" x2="281" y2="324" stroke="#333" stroke-width="1.5" />
        </g>
        <!-- Pink Ears -->
        <g id="svg-pink-ears" class="hidden">
          <ellipse cx="120" cy="200" rx="20" ry="32" fill="#ffb6c1" stroke="#ff69b4" stroke-width="4"/>
          <ellipse cx="360" cy="200" rx="20" ry="32" fill="#ffb6c1" stroke="#ff69b4" stroke-width="4"/>
        </g>
        <!-- White Arms with Thick Black Outline -->
        <g id="svg-white-arms" class="hidden">
          <path d="M 130 240 Q 60 220, 65 270" fill="none" stroke="black" stroke-width="18" stroke-linecap="round"/>
          <path d="M 130 240 Q 60 220, 65 270" fill="none" stroke="white" stroke-width="12" stroke-linecap="round"/>
          <path d="M 350 240 Q 420 220, 415 270" fill="none" stroke="black" stroke-width="18" stroke-linecap="round"/>
          <path d="M 350 240 Q 420 220, 415 270" fill="none" stroke="white" stroke-width="12" stroke-linecap="round"/>
        </g>
        <!-- Two Blue Shoes -->
        <g id="svg-blue-shoes" class="hidden">
          <ellipse cx="180" cy="415" rx="38" ry="18" fill="#3498db" stroke="#2980b9" stroke-width="4" />
          <ellipse cx="300" cy="415" rx="38" ry="18" fill="#3498db" stroke="#2980b9" stroke-width="4" />
        </g>
      </svg>

      <!-- Curtain Overlay for Mode 3 -->
      <div id="curtain" class="hidden">🙈 Close your eyes!</div>

      <!-- Celebration Overlay -->
      <div id="celebration" class="hidden">
        <h2 id="celeb-title">🎉 AMAZING JOB! 🎉</h2>
        <p id="celeb-msg">You built the whole potato!</p>
        <button class="replay-btn" onclick="restartCurrentMode()">Play Again! 🔄</button>
      </div>
    </div>

    <!-- Controls Right -->
    <div id="controls">
      <div class="instruction-box">
        <button class="big-speaker-btn" onclick="repeatAudio()">🔊</button>
        <span id="instruction-text">Tap a picture card!</span>
      </div>
      <div id="btn-grid" class="button-grid">
        <!-- Dynamic Picture Cards -->
      </div>
    </div>
  </div>

  <!-- Monochrome Printable Coloring Coloring Sheet (Hidden except during Print) -->
  <div class="print-only">
    <div class="print-header">
      <h1>My Funny Potato Coloring Sheet</h1>
      <p style="margin: 5px 0; font-size: 14pt;">Color the potato face! Can you find what's missing and draw it?</p>
    </div>
    <div class="print-fields">
      <span>Name: ______________________</span>
      <span>Date: ________________</span>
    </div>

    <div class="print-layout">
      <!-- Full Extra-Large Monochrome Line-Art Potato Drawing (Centered, Arms Missing) -->
      <div class="print-drawing-box">
        <svg viewBox="0 0 480 500" style="width: 680px; height: 750px;">
          <!-- Body Outline -->
          <path d="M 240 100 C 320 100, 350 175, 350 270 C 350 375, 310 415, 240 415 C 170 415, 130 375, 130 270 C 130 175, 160 100, 240 100 Z" fill="white" stroke="black" stroke-width="4"/>
          <!-- Pink Ears Outline -->
          <ellipse cx="120" cy="200" rx="20" ry="32" fill="white" stroke="black" stroke-width="3"/>
          <ellipse cx="360" cy="200" rx="20" ry="32" fill="white" stroke="black" stroke-width="3"/>
          <!-- Blue Shoes Outline -->
          <ellipse cx="180" cy="415" rx="38" ry="18" fill="white" stroke="black" stroke-width="3" />
          <ellipse cx="300" cy="415" rx="38" ry="18" fill="white" stroke="black" stroke-width="3" />
          <!-- Black Hat Outline -->
          <path d="M 180 100 L 300 100 L 300 55 C 300 35, 180 35, 180 55 Z" fill="white" stroke="black" stroke-width="3"/>
          <ellipse cx="240" cy="100" rx="85" ry="14" fill="white" stroke="black" stroke-width="3"/>
          <!-- Eyebrows Outline -->
          <rect x="180" y="130" width="45" height="12" rx="5" fill="white" stroke="black" stroke-width="2" transform="rotate(-5 180 130)"/>
          <rect x="255" y="126" width="45" height="12" rx="5" fill="white" stroke="black" stroke-width="2" transform="rotate(5 255 126)"/>
          <!-- Eyes Outline -->
          <circle cx="200" cy="160" r="22" fill="white" stroke="black" stroke-width="3"/>
          <circle cx="200" cy="160" r="6" fill="black"/>
          <circle cx="280" cy="160" r="22" fill="white" stroke="black" stroke-width="3"/>
          <circle cx="280" cy="160" r="6" fill="black"/>
          <!-- Pear Nose Outline -->
          <path d="M 240 195 C 228 195, 222 210, 208 230 C 195 250, 210 265, 240 265 C 270 265, 285 250, 272 230 C 258 210, 252 195, 240 195 Z" fill="white" stroke="black" stroke-width="3"/>
          <!-- Mustache Outline -->
          <path d="M 240 270 Q 210 245, 160 275 Q 210 295, 240 278 Q 270 295, 320 275 Q 270 245, 240 270 Z" fill="white" stroke="black" stroke-width="3"/>
          <!-- Wide Mouth Outline -->
          <path d="M 160 300 Q 240 380, 320 300 Z" fill="white" stroke="black" stroke-width="3"/>
          <path d="M 172 300 L 308 300 L 302 322 Q 240 330, 178 322 Z" fill="white" stroke="black" stroke-width="2"/>
          <line x1="199" y1="300" x2="199" y2="324" stroke="black" stroke-width="1.5" />
          <line x1="226" y1="300" x2="226" y2="327" stroke="black" stroke-width="1.5" />
          <line x1="254" y1="300" x2="254" y2="327" stroke="black" stroke-width="1.5" />
          <line x1="281" y1="300" x2="281" y2="324" stroke="black" stroke-width="1.5" />
        </svg>
      </div>
    </div>
  </div>

<script>
  const parts = [
    { id: 'face', name: 'Brown Face', spoken: 'a big brown face', plural: false, svg: '<svg viewBox="0 0 100 100"><path d="M 50 15 C 75 15, 85 35, 85 60 C 85 85, 72 90, 50 90 C 28 90, 15 85, 15 60 C 15 35, 25 15, 50 15 Z" fill="#b37d4e" stroke="#6d4c2d" stroke-width="3"/></svg>' },
    { id: 'hat', name: 'Black Hat', spoken: 'a black hat', plural: false, svg: '<svg viewBox="0 0 100 100"><path d="M 20 65 L 80 65 L 80 35 C 80 20, 20 20, 20 35 Z" fill="#2c3e50"/><ellipse cx="50" cy="65" rx="42" ry="8" fill="#2c3e50"/></svg>' },
    { id: 'eyebrows', name: 'Two Eyebrows', spoken: 'two thick eyebrows', plural: true, svg: '<svg viewBox="0 0 100 100"><rect x="15" y="45" width="30" height="10" rx="3" fill="#2c3e50" transform="rotate(-5 15 45)"/><rect x="55" y="42" width="30" height="10" rx="3" fill="#2c3e50" transform="rotate(5 55 42)"/></svg>' },
    { id: 'googly-eyes', name: 'Two Eyes', spoken: 'two googly eyes', plural: true, svg: '<svg viewBox="0 0 100 100"><circle cx="30" cy="50" r="18" fill="white" stroke="black" stroke-width="3"/><circle cx="30" cy="50" r="7" fill="black"/><circle cx="70" cy="50" r="18" fill="white" stroke="black" stroke-width="3"/><circle cx="70" cy="50" r="7" fill="black"/></svg>' },
    { id: 'nose', name: 'Orange Nose', spoken: 'a big orange nose', plural: false, svg: '<svg viewBox="0 0 100 100"><path d="M 50 25 C 43 25, 38 35, 32 52 C 26 68, 33 80, 50 80 C 67 80, 74 68, 68 52 C 62 35, 57 25, 50 25 Z" fill="#e67e22" stroke="#d35400" stroke-width="3"/></svg>' },
    { id: 'mustache', name: 'Mustache', spoken: 'a black mustache', plural: false, svg: '<svg viewBox="0 0 100 100"><path d="M 50 45 Q 35 30, 10 50 Q 35 60, 50 50 Q 65 60, 90 50 Q 65 30, 50 45 Z" fill="#111"/></svg>' },
    { id: 'mouth', name: 'Big Red Mouth', spoken: 'a big red mouth', plural: false, svg: '<svg viewBox="0 0 100 100"><path d="M 15 40 Q 50 90, 85 40 Z" fill="#e74c3c" stroke="#c0392b" stroke-width="3"/><path d="M 22 40 L 78 40 L 74 54 Q 50 60, 26 54 Z" fill="white" stroke="#333" stroke-width="1.5"/><line x1="36" y1="40" x2="36" y2="56" stroke="#333" stroke-width="1"/><line x1="50" y1="40" x2="50" y2="58" stroke="#333" stroke-width="1"/><line x1="64" y1="40" x2="64" y2="56" stroke="#333" stroke-width="1"/></svg>' },
    { id: 'pink-ears', name: 'Pink Ears', spoken: 'two pink ears', plural: true, svg: '<svg viewBox="0 0 100 100"><ellipse cx="28" cy="50" rx="14" ry="25" fill="#ffb6c1" stroke="#ff69b4" stroke-width="3"/><ellipse cx="72" cy="50" rx="14" ry="25" fill="#ffb6c1" stroke="#ff69b4" stroke-width="3"/></svg>' },
    { id: 'white-arms', name: 'White Arms', spoken: 'two white arms', plural: true, svg: '<svg viewBox="0 0 100 100"><path d="M 35 35 Q 10 30, 15 65" fill="none" stroke="black" stroke-width="12" stroke-linecap="round"/><path d="M 35 35 Q 10 30, 15 65" fill="none" stroke="white" stroke-width="7" stroke-linecap="round"/><path d="M 65 35 Q 90 30, 85 65" fill="none" stroke="black" stroke-width="12" stroke-linecap="round"/><path d="M 65 35 Q 90 30, 85 65" fill="none" stroke="white" stroke-width="7" stroke-linecap="round"/></svg>' },
    { id: 'blue-shoes', name: 'Blue Shoes', spoken: 'two blue shoes', plural: true, svg: '<svg viewBox="0 0 100 100"><ellipse cx="30" cy="55" rx="22" ry="12" fill="#3498db" stroke="#2980b9" stroke-width="3"/><ellipse cx="70" cy="55" rx="22" ry="12" fill="#3498db" stroke="#2980b9" stroke-width="3"/></svg>' }
  ];

  let currentMode = 1;
  let remainingMode2Parts = [];
  let currentTargetMode2 = null;

  let remainingMode3Parts = [];
  let currentMissingMode3 = null;

  let preferredVoice = null;
  let lastSpokenText = "";

  function loadVoices() {
    if (!('speechSynthesis' in window)) return;
    const voices = window.speechSynthesis.getVoices();
    if (voices.length === 0) return;

    const usVoices = voices.filter(v => v.lang === "en-US" || v.lang === "en_US" || v.lang.startsWith("en"));
    
    preferredVoice = 
      usVoices.find(v => v.name.includes("Samantha")) ||
      usVoices.find(v => v.name.includes("Ava")) ||
      usVoices.find(v => v.name.includes("Ana")) ||
      usVoices.find(v => v.name.includes("Jenny")) ||
      usVoices.find(v => v.name.includes("Google US English")) ||
      usVoices.find(v => v.name.includes("Aria")) ||
      usVoices[0] || voices[0];
  }

  if (typeof window !== 'undefined' && window.speechSynthesis) {
    window.speechSynthesis.onvoiceschanged = loadVoices;
    loadVoices();
  }

  function speak(text) {
    if (!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    if (!preferredVoice) loadVoices();

    const uttr = new SpeechSynthesisUtterance(text);
    if (preferredVoice) uttr.voice = preferredVoice;
    uttr.lang = 'en-US';
    uttr.rate = 0.60;
    uttr.pitch = 1.25;

    lastSpokenText = text;
    window.speechSynthesis.resume();
    window.speechSynthesis.speak(uttr);
  }

  function repeatAudio() {
    if (lastSpokenText) speak(lastSpokenText);
  }

  function setMode(mode) {
    currentMode = mode;
    document.querySelectorAll('.nav-btn').forEach((btn, i) => {
      btn.classList.toggle('active', i + 1 === mode);
    });

    hideAllParts();
    document.getElementById('curtain').classList.add('hidden');
    document.getElementById('celebration').classList.add('hidden');

    if (mode === 1) setupMode1();
    else if (mode === 2) setupMode2();
    else if (mode === 3) setupMode3();
  }

  function restartCurrentMode() { setMode(currentMode); }
  function hideAllParts() { parts.forEach(p => document.getElementById(`svg-${p.id}`).classList.add('hidden')); }
  function showAllParts() { parts.forEach(p => document.getElementById(`svg-${p.id}`).classList.remove('hidden')); }
  function updateUIInstruction(text) { document.getElementById('instruction-text').innerText = text; }

  /* --- MODE 1: Learn Vocab --- */
  function setupMode1() {
    hideAllParts(); // Starts on a clean white workspace with black dotted outline!

    const grid = document.getElementById('btn-grid');
    grid.innerHTML = '';
    updateUIInstruction("Tap a picture!");
    speak("Tap a picture!");

    parts.forEach(p => {
      const btn = document.createElement('button');
      btn.className = 'card-btn';
      btn.innerHTML = p.svg;
      btn.onclick = () => {
        const elem = document.getElementById(`svg-${p.id}`);
        elem.classList.toggle('hidden');
        updateUIInstruction(p.spoken);
        speak(p.spoken);
      };
      grid.appendChild(btn);
    });
  }

  /* --- MODE 2: Listen & Find (No Duplicates) --- */
  function setupMode2() {
    remainingMode2Parts = [...parts];
    const grid = document.getElementById('btn-grid');
    grid.innerHTML = '';

    parts.forEach(p => {
      const btn = document.createElement('button');
      btn.className = 'card-btn';
      btn.innerHTML = p.svg;
      btn.onclick = () => checkMode2Answer(p);
      grid.appendChild(btn);
    });

    nextMode2Question();
  }

  function nextMode2Question() {
    if (remainingMode2Parts.length === 0) {
      document.getElementById('celebration').classList.remove('hidden');
      document.getElementById('celeb-title').innerText = "🎉 FANTASTIC! 🎉";
      document.getElementById('celeb-msg').innerText = "You built the whole potato!";
      speak("Awesome job! You built the whole potato!");
      return;
    }

    const randomIndex = Math.floor(Math.random() * remainingMode2Parts.length);
    currentTargetMode2 = remainingMode2Parts[randomIndex];
    
    const promptText = `Find ${currentTargetMode2.spoken}!`;
    updateUIInstruction(promptText);
    speak(promptText);
  }

  function checkMode2Answer(selected) {
    if (!currentTargetMode2) return;

    if (selected.id === currentTargetMode2.id) {
      document.getElementById(`svg-${selected.id}`).classList.remove('hidden');
      remainingMode2Parts = remainingMode2Parts.filter(p => p.id !== selected.id);

      const shortCompliments = ["Great!", "Awesome!", "Super!", "You got it!"];
      const praise = shortCompliments[Math.floor(Math.random() * shortCompliments.length)];
      
      updateUIInstruction(praise);
      speak(praise);
      setTimeout(nextMode2Question, 1400);
    } else {
      const retryText = `Try again! Find ${currentTargetMode2.spoken}!`;
      updateUIInstruction(retryText);
      speak(retryText);
    }
  }

  /* --- MODE 3: What's Missing? (No Duplicates) --- */
  function setupMode3() {
    remainingMode3Parts = [...parts];
    const grid = document.getElementById('btn-grid');
    grid.innerHTML = '';

    const startBtn = document.createElement('button');
    startBtn.className = 'card-btn';
    startBtn.style.gridColumn = 'span 3';
    startBtn.style.height = '50px';
    startBtn.style.background = '#e74c3c';
    startBtn.style.color = 'white';
    startBtn.style.fontWeight = 'bold';
    startBtn.style.fontSize = '1.2rem';
    startBtn.innerText = '🎲 Hide a Part!';
    startBtn.onclick = startMissingGame;
    grid.appendChild(startBtn);

    parts.forEach(p => {
      const btn = document.createElement('button');
      btn.className = 'card-btn';
      btn.innerHTML = p.svg;
      btn.onclick = () => checkMissingAnswer(p);
      grid.appendChild(btn);
    });

    showAllParts();
    updateUIInstruction("Look closely at the potato!");
    speak("Look closely at the potato!");
  }

  function startMissingGame() {
    if (remainingMode3Parts.length === 0) {
      document.getElementById('celebration').classList.remove('hidden');
      document.getElementById('celeb-title').innerText = "🏆 SUPER DETECTIVE! 🏆";
      document.getElementById('celeb-msg').innerText = "You found all the missing parts!";
      speak("Super job! You found all the missing parts!");
      return;
    }

    showAllParts();
    const curtain = document.getElementById('curtain');
    curtain.classList.remove('hidden');
    
    updateUIInstruction("Close your eyes!");
    speak("Close your eyes!");

    setTimeout(() => {
      const randomIndex = Math.floor(Math.random() * remainingMode3Parts.length);
      currentMissingMode3 = remainingMode3Parts[randomIndex];
      
      document.getElementById(`svg-${currentMissingMode3.id}`).classList.add('hidden');

      curtain.classList.add('hidden');
      updateUIInstruction("What's missing?");
      speak("Open your eyes! What's missing?");
    }, 2800);
  }

  function checkMissingAnswer(selected) {
    if (!currentMissingMode3) return;

    if (selected.id === currentMissingMode3.id) {
      document.getElementById(`svg-${currentMissingMode3.id}`).classList.remove('hidden');
      remainingMode3Parts = remainingMode3Parts.filter(p => p.id !== selected.id);

      const verb = selected.plural ? "were" : "was";
      const successText = `${selected.spoken.charAt(0).toUpperCase() + selected.spoken.slice(1)} ${verb} missing!`;
      
      updateUIInstruction(successText);
      speak(`Great job! ${selected.spoken} ${verb} missing!`);
      currentMissingMode3 = null;

      if (remainingMode3Parts.length === 0) {
        setTimeout(() => {
          document.getElementById('celebration').classList.remove('hidden');
          document.getElementById('celeb-title').innerText = "🏆 SUPER DETECTIVE! 🏆";
          document.getElementById('celeb-msg').innerText = "You found all the missing parts!";
          speak("Super job! You found all the missing parts!");
        }, 2200);
      }
    } else {
      updateUIInstruction("Try again!");
      speak("Nope! Look closer!");
    }
  }

  // Initialize Mode 1 on Load
  setMode(1);
</script>
</body>
</html>
