<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phonics Lesson - [Spring] Scene 4 Damaged Branches</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
            background: linear-gradient(135deg, #e0f7fa, #b2ebf2);
            display: flex; justify-content: center; align-items: center;
            height: 100vh; margin: 0; text-align: center;
        }
        .card {
            background: white; padding: 50px; border-radius: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 85%; max-width: 850px;
        }
        .word-display { font-size: 5rem; font-weight: bold; margin: 20px 0; min-height: 140px; }
        .phrase-display { font-size: 3rem; font-weight: bold; color: #2c3e50; line-height: 1.4; }
        .trans { font-size: 1.8rem; color: #888; margin-bottom: 30px; min-height: 2.5rem; }
        .unit { display: inline-block; transition: 0.3s; color: #ccc; margin: 0 5px; }
        .active { color: #00bcd4; transform: scale(1.1); text-decoration: underline; }
        .btn {
            padding: 15px 40px; font-size: 1.5rem; border-radius: 50px;
            border: none; cursor: pointer; margin: 10px; font-weight: bold;
            box-shadow: 0 6px 0 #bbb; transition: 0.1s;
        }
        .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #bbb; }
        .btn-yes { background: #2ed573; color: white; box-shadow: 0 6px 0 #26af5c; }
        .btn-no { background: #ff4757; color: white; box-shadow: 0 6px 0 #d63031; }
        .btn-next { background: #ffa502; color: white; box-shadow: 0 6px 0 #e67e22; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="card">
    <div id="q-text" style="font-size: 1.5rem; color: #555;">Can you read it?</div>
    <div id="display" class="word-display"></div>
    <div id="trans" class="trans"></div>

    <div id="btns-init">
        <button class="btn btn-yes" onclick="ansYes()">Yes! 👍</button>
        <button class="btn btn-no" onclick="ansNo()">No 😢</button>
    </div>
    <div id="btns-step" class="hidden">
        <button class="btn btn-next" onclick="doNext()">Next Step ➔</button>
    </div>
    <div id="btns-final" class="hidden">
        <button class="btn btn-yes" id="main-btn" onclick="nextContent()">Next Word 🚀</button>
    </div>
</div>

<script>
    const wordList = [
        { w: "well", s: ["w", "ell"], t: "ええと / さて" },
        { w: "ogre", s: ["o", "gre"], t: "おに" },
        { w: "punishing", s: ["pu", "ni", "sh", "ing"], t: "罰を与えている" },
        { w: "chirping", s: ["ch", "irp", "ing"], t: "鳴いている" },
        { w: "too", s: ["t", "oo"], t: "〜すぎる" },
        { w: "much", s: ["mu", "ch"], t: "たくさん" },
        { w: "that", s: ["th", "at"], t: "あれ / それ" },
        { w: "ridiculous", s: ["ri", "di", "cu", "lous"], t: "ばかげた" },
        { w: "absurd", s: ["ab", "sur", "d"], t: "不条理な / めちゃくちゃな" },
        { w: "kind", s: ["k", "ind"], t: "種類" },
        { w: "punishment", s: ["pu", "ni", "sh", "ment"], t: "罰" },
        { w: "look", s: ["l", "oo", "k"], t: "見て" },
        { w: "silver", s: ["s", "il", "v", "er"], t: "銀色の" },
        { w: "powder", s: ["p", "ow", "d", "er"], t: "粉" },
        { w: "help", s: ["h", "elp"], t: "助ける" },
        { w: "branches", s: ["bra", "n", "ch", "es"], t: "枝" },
        { w: "hurt", s: ["h", "ur", "t"], t: "傷ついた" },
        { w: "but", s: ["b", "ut"], t: "でも" },
        { w: "think", s: ["th", "ink"], t: "思う" },
        { w: "can", s: ["c", "an"], t: "できる" },
        { w: "fix", s: ["f", "ix"], t: "直す" },
        { w: "problem", s: ["pro", "b", "lem"], t: "問題" },
        { w: "fortune", s: ["f", "or", "tune"], t: "幸運 / フォーチュン" },
        { w: "please", s: ["p", "l", "ea", "se"], t: "お願いします" },
        { w: "help", s: ["h", "el", "p"], t: "助けて" }
    ];

    const phraseList = [
        { w: "Well, an ogre is punishing us.", t: "ええと、おにが僕たちを罰しているんだ。" },
        { w: "For chirping too much?", t: "鳴きすぎたからって？" },
        { w: "That's ridiculous!", t: "そんなのばかげてる！" },
        { w: "Yeah, that's absurd!", t: "そうだよ、めちゃくちゃだ！" },
        { w: "What kind of punishment?", t: "どんな罰なの？" },
        { w: "Look!", t: "見て！" },
        { w: "Silver powder...", t: "銀色の粉が…" },
        { w: "Can you help us?", t: "助けてくれる？" },
        { w: "These branches look hurt.", t: "この枝は傷ついているみたい。" },
        { w: "Oh, no!", t: "なんてことだ！" },
        { w: "But I think I can fix the problem.", t: "でも、私が問題を解決できると思うわ。" },
        { w: "Fortune, please help us!", t: "フォーチュン、助けて！" },
        { w: "Fortune, you can do it!", t: "フォーチュンならできるよ！" }
    ];

    let currentIdx = -1;
    let step = 0;
    let isPhraseMode = false;

    // ダイアログ版から抜き出した「いい声」を選ぶための関数
    function getFemaleVoice() {
        const voices = window.speechSynthesis.getVoices();
        const preferred = ["Google US English", "Microsoft Zira", "Samantha", "Female"];
        let selected = null;
        for (let name of preferred) {
            selected = voices.find(v => (v.lang === 'en-US' || v.lang === 'en_US') && v.name.includes(name));
            if (selected) break;
        }
        return selected || voices.find(v => v.lang.startsWith('en'));
    }

    // 抜き出した設定を反映させた再生関数
    function speak(txt, rate = 0.6) { 
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(txt);
        
        const v = getFemaleVoice();
        if (v) u.voice = v;
        
        u.lang = 'en-US';
        u.rate = rate; 
        u.pitch = 1.0; 
        
        window.speechSynthesis.speak(u);
    }

    // 音声の準備ができたら設定を行う
    window.speechSynthesis.onvoiceschanged = getFemaleVoice;

    function nextContent() {
        if (!isPhraseMode) {
            currentIdx++;
            if (currentIdx < wordList.length) {
                initWord();
            } else {
                isPhraseMode = true;
                currentIdx = 0;
                initPhrase();
            }
        } else {
            currentIdx++;
            if (currentIdx < phraseList.length) {
                initPhrase();
            } else {
                finishGame();
            }
        }
    }

    function initWord() {
        step = -1;
        const data = wordList[currentIdx];
        document.getElementById('q-text').textContent = "Can you read it?";
        document.getElementById('display').className = "word-display";
        document.getElementById('display').innerText = data.w;
        document.getElementById('trans').innerText = "(" + data.t + ")";
        
        document.getElementById('btns-init').classList.remove('hidden');
        document.getElementById('btns-step').classList.add('hidden');
        document.getElementById('btns-final').classList.add('hidden');
    }

    function ansYes() {
        confetti({ particleCount: 100, spread: 70 });
        speak(wordList[currentIdx].w);
        showFinalBtn();
    }

    function ansNo() {
        step = 0;
        document.getElementById('btns-init').classList.add('hidden');
        document.getElementById('btns-step').classList.remove('hidden');
        renderStep();
    }

    function renderStep() {
        let h = "";
        wordList[currentIdx].s.forEach((u, i) => {
            h += `<span class="unit ${i === step ? 'active' : ''}">${u}</span>`;
        });
        document.getElementById('display').innerHTML = h;
    }

    function doNext() {
        step++;
        if (step >= wordList[currentIdx].s.length) {
            document.getElementById('display').innerText = wordList[currentIdx].w;
            speak(wordList[currentIdx].w);
            showFinalBtn();
        } else {
            renderStep();
        }
    }

    function initPhrase() {
        document.getElementById('q-text').textContent = "Read the story!";
        const area = document.getElementById('display');
        area.className = "phrase-display";
        area.innerText = phraseList[currentIdx].w;
        document.getElementById('trans').innerText = "(" + phraseList[currentIdx].t + ")";
        
        document.getElementById('btns-init').classList.add('hidden');
        document.getElementById('btns-step').classList.add('hidden');
        document.getElementById('btns-final').classList.remove('hidden');
        document.getElementById('main-btn').textContent = "Next ➔";
        
        speak(phraseList[currentIdx].w, 0.6); 
    }

    function showFinalBtn() {
        document.getElementById('btns-step').classList.add('hidden');
        document.getElementById('btns-final').classList.remove('hidden');
        document.getElementById('main-btn').textContent = "Next Word 🚀";
    }

    function finishGame() {
        document.getElementById('q-text').textContent = "Excellent!";
        document.getElementById('display').innerHTML = "Fortune will bring the blossoms back! 🌸";
        document.getElementById('trans').innerText = "フォーチュンが花を咲かせてくれるよ！";
        document.getElementById('btns-final').classList.add('hidden');
        speak("Great job! Fortune will bring the blooms back!", 0.6);
        confetti({ particleCount: 200, spread: 100 });
    }

    nextContent();
</script>
</body>
</html>
